<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: #1a5d1a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 20px;
            background: #fff;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #1a5d1a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FoodSave</h1>
        </div>
        <div class="content">
            <h2>New Pickup Request</h2>
            <p>Hello {{name}},</p>
            <p>You have received a new pickup request for your donation "{{donation_title}}".</p>
            <p>Please review the request and approve or reject it.</p>
            <p>
                <a href="{{request_link}}" class="button">View Request</a>
            </p>
        </div>
        <div class="footer">
            <p>This is an automated message from FoodSave. Please do not reply to this email.</p>
        </div>
    </div>
</body>
</html>
